name: test

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  make-test:
    name: make test (Ubuntu, no PostgreSQL needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libpam0g-dev pkg-config \
            openssh-client python3 python3-cryptography python3-psycopg2 python3-bcrypt file
      - name: Build and run every suite
        run: make test
      - name: Check that make test runs every suite and nothing built is tracked
        run: tests/test_make_test.sh
